name: Update Tap from Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.1)"
        required: true
      cli_assets:
        description: "Comma-separated CLI asset names"
        required: true
      cask_assets:
        description: "Comma-separated cask asset names"
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update formula and cask
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.tag }}"
          VERSION="${VERSION#v}"

          mkdir -p tmp

          for asset in $(echo "${{ github.event.inputs.cli_assets }}" | tr ',' '\n'); do
            [ -z "$asset" ] && continue
            curl -sL "https://github.com/poco-ai/Agentero/releases/download/v${VERSION}/${asset}" -o "tmp/${asset}"
            sha=$(sha256sum "tmp/${asset}" | cut -d' ' -f1)
            case "$asset" in
              *aarch64-apple-darwin*) sed -i "s/PLACEHOLDER_SHA256_AARCH64_APPLE_DARWIN/${sha}/" Formula/agentero.rb ;;
              *x86_64-apple-darwin*) sed -i "s/PLACEHOLDER_SHA256_X86_64_APPLE_DARWIN/${sha}/" Formula/agentero.rb ;;
              *x86_64-unknown-linux-gnu*) sed -i "s/PLACEHOLDER_SHA256_X86_64_UNKNOWN_LINUX_GNU/${sha}/" Formula/agentero.rb ;;
            esac
          done

          for asset in $(echo "${{ github.event.inputs.cask_assets }}" | tr ',' '\n'); do
            [ -z "$asset" ] && continue
            curl -sL "https://github.com/poco-ai/Agentero/releases/download/v${VERSION}/${asset}" -o "tmp/${asset}"
            sha=$(sha256sum "tmp/${asset}" | cut -d' ' -f1)
            case "$asset" in
              *_aarch64.dmg) sed -i "s/PLACEHOLDER_SHA256_AARCH64_DMG/${sha}/" Casks/agentero.rb ;;
              *_x64.dmg) sed -i "s/PLACEHOLDER_SHA256_X64_DMG/${sha}/" Casks/agentero.rb ;;
            esac
          done

          sed -i "s/version \"[0-9.]*\"/version \"${VERSION}\"/" Formula/agentero.rb
          sed -i "s/version \"[0-9.]*\"/version \"${VERSION}\"/" Casks/agentero.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/agentero.rb Casks/agentero.rb
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: bump agentero to ${{ github.event.inputs.tag }}"
          git push
